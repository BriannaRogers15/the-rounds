name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The menu check compares against the previous published version.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Firebase Auth + Firestore emulators are Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Fast and needs no install: refuses malformed menus, unsourced
      # changes, sudden menu wipes, and a menu change without a new
      # service worker version (scripts/check-menus.js).
      - name: Check menus
        run: node scripts/check-menus.js --base="$BASE"
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'origin/develop' }}

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Starts the emulators (tests/global-setup.js) and the static server
      # (playwright.config.js webServer) itself — nothing else to launch.
      - run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
