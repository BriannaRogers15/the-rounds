<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Rounds — A Chicagoland Dining Ledger</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3B1C16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Rounds">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --brick: #3B1C16;
  --brick-deep: #29130F;
  --brick-panel: #522A20;
  --brick-panel-hi: #6B3A2A;
  --flag-blue: #4FA8DE;
  --flag-blue-bright: #7EC8F2;
  --flag-blue-dim: rgba(79,168,222,0.35);
  --cream: #F3EDE0;
  --cream-dim: rgba(243,237,224,0.62);
  --flag-red: #E23A50;
  --flag-red-dim: rgba(226,58,80,0.35);
  --river-green: #1FA463;
  --rating-gold: #D9A441;
  --hairline: rgba(243,237,224,0.16);
}

*{ box-sizing: border-box; }

body{
  margin:0;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 27px, rgba(0,0,0,0.16) 27px, rgba(0,0,0,0.16) 29px),
    repeating-linear-gradient(90deg, rgba(243,237,224,0.025) 0px, rgba(243,237,224,0.025) 1px, transparent 1px, transparent 63px),
    radial-gradient(circle at 15% 0%, rgba(79,168,222,0.07), transparent 45%),
    radial-gradient(circle at 90% 100%, rgba(226,58,80,0.05), transparent 45%),
    var(--brick);
  color: var(--cream);
  font-family: 'Manrope', sans-serif;
  min-height: 100vh;
  padding: 0 0 70px 0;
}

.wrap{ max-width: 1000px; margin: 0 auto; padding: 40px 20px 0; }

/* ---- Header ---- */
header{ text-align:center; margin-bottom: 20px; }
.emblem{ width:58px; height:36px; margin: 0 auto 10px; display:block; }
.eyebrow{
  font-family:'IBM Plex Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 4px;
  color: var(--flag-blue);
  text-transform: uppercase;
}
h1{
  font-family:'Oswald', sans-serif;
  font-weight: 700;
  font-size: 42px;
  margin: 8px 0 6px;
  letter-spacing: 0.5px;
  color: var(--cream);
}
.sub{ font-size:13px; color: var(--cream-dim); font-weight:500; }
.rule{
  width: 120px; height:1px; margin: 18px auto 0;
  background: linear-gradient(90deg, transparent, var(--flag-blue), transparent);
}

/* ---- Stats bar ---- */
.receipt{
  background: linear-gradient(180deg, var(--brick-panel), var(--brick-panel-hi));
  border: 1px solid var(--hairline);
  border-radius: 10px;
  margin: 26px auto 30px;
  max-width: 680px;
  padding: 18px 10px;
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  box-shadow: 0 12px 30px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.03);
}
.receipt-row{
  display:flex; flex-direction:column; align-items:center; gap:4px;
  padding: 4px 8px;
  border-right: 1px solid var(--hairline);
}
.receipt-row:last-child{ border-right:none; }
.receipt-label{
  font-family:'IBM Plex Mono', monospace;
  font-size: 9.5px; letter-spacing: 1.2px; text-transform:uppercase;
  color: var(--cream-dim);
}
.receipt-val{
  font-family:'Oswald', sans-serif; font-weight:700; font-size: 21px; color: var(--flag-blue-bright);
  transition: color .15s ease;
}
.receipt-val.muted{ color: var(--cream-dim); font-weight:500; opacity:0.6; }
@media (max-width: 620px){
  .receipt{ grid-template-columns: repeat(2, 1fr); }
  .receipt-row{ border-right:none; border-bottom:1px solid var(--hairline); padding-bottom:10px; }
}

/* ---- Controls row ---- */
.controls{
  display:flex; gap:10px; align-items:center; justify-content:space-between;
  flex-wrap: wrap; margin-bottom: 14px;
  background: linear-gradient(160deg, var(--brick-panel-hi), var(--brick-panel));
  border: 1px solid var(--hairline);
  border-radius: 16px;
  padding: 10px 12px 10px 16px;
  box-shadow: 0 12px 28px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.03);
}
.tabs{
  display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; flex:1;
}
.tab{
  font-family:'IBM Plex Mono', monospace;
  font-size: 11px; letter-spacing: 0.8px;
  background: var(--brick-deep);
  border: 1px solid var(--hairline);
  color: var(--cream-dim);
  padding: 8px 14px;
  border-radius: 999px;
  cursor:pointer;
  white-space: nowrap;
  flex-shrink:0;
  transition: all .15s ease;
  position: relative;
}
.tab:hover{ border-color: var(--flag-blue-dim); color: var(--cream); }
.tab.active{
  background: var(--flag-blue);
  color: var(--brick-deep);
  border-color: var(--flag-blue);
  font-weight:600;
  padding-left: 20px;
  box-shadow: 0 4px 14px rgba(79,168,222,0.35);
}
.tab.active::before{
  content:"";
  position:absolute; left:10px; top:50%; transform:translateY(-50%);
  width:6px; height:6px; border-radius:50%;
  background: var(--flag-red);
  box-shadow: 0 0 0 2px rgba(226,58,80,0.25);
}
.tab .cnt{ opacity:0.65; margin-left:5px; }

.sub-tabs{ margin-top:-6px; margin-bottom:14px; padding-left:6px; border-left: 2px solid var(--hairline); }
.sub-tab{
  font-family:'Manrope', sans-serif; font-weight:600; font-size:11px;
  background: transparent; border: 1px solid var(--hairline); color: var(--cream-dim);
  padding: 6px 12px; border-radius: 999px; cursor:pointer; white-space:nowrap; flex-shrink:0;
  transition: all .15s ease;
}
.sub-tab:hover{ border-color: var(--flag-blue-dim); color: var(--cream); }
.sub-tab.active{ background: var(--flag-blue-dim); border-color: var(--flag-blue); color: var(--cream); font-weight:700; }
.sub-tab .cnt{ opacity:0.7; margin-left:4px; }

.btn{
  font-family:'Manrope', sans-serif;
  font-weight:700;
  font-size: 12.5px;
  border: 1px solid var(--flag-blue);
  background: linear-gradient(180deg, var(--flag-blue-bright), var(--flag-blue));
  color: var(--brick-deep);
  padding: 10px 18px;
  border-radius: 999px;
  cursor:pointer;
  white-space:nowrap;
  transition: transform .12s ease, box-shadow .12s ease;
}
.btn:hover{ transform: translateY(-1px); box-shadow: 0 6px 16px rgba(79,168,222,0.35); }
.btn.secondary{
  background: transparent; color: var(--cream); border-color: var(--hairline);
}
.btn.secondary:hover{ box-shadow:none; border-color: var(--flag-blue-dim); }
.btn.danger{ background: var(--flag-red); border-color: var(--flag-red); color: var(--cream); }
.btn.small{ padding:7px 13px; font-size:11px; }

/* ---- Tools row: search, filters, sort, view switch ---- */
.tools-row{
  display:flex; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap;
  background: linear-gradient(160deg, var(--brick-panel-hi), var(--brick-panel));
  border: 1px solid var(--hairline);
  border-radius: 16px;
  padding: 12px 16px;
  box-shadow: 0 12px 28px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.03);
}
.search-wrap{ position:relative; flex: 1 1 200px; min-width: 170px; }
.search-wrap svg{
  position:absolute; left:13px; top:50%; transform:translateY(-50%);
  width:14px; height:14px; color: var(--cream-dim); pointer-events:none;
}
.search-box{
  width:100%;
  font-family:'Manrope', sans-serif; font-size:13px;
  padding: 9px 14px 9px 34px; border:1px solid var(--hairline); border-radius:999px;
  background: var(--brick-deep); color: var(--cream);
  transition: border-color .15s ease, box-shadow .15s ease;
}
.search-box::placeholder{ color: var(--cream-dim); }
.search-box:focus{ outline:none; border-color: var(--flag-blue); box-shadow: 0 0 0 3px rgba(79,168,222,0.15); }
.filter-chip{
  font-family:'Manrope', sans-serif; font-weight:600; font-size:11.5px;
  background: var(--brick-deep); border: 1px solid var(--hairline); color: var(--cream-dim);
  padding: 8px 14px; border-radius: 999px; cursor:pointer; white-space:nowrap; transition: all .15s ease;
  display:flex; align-items:center; gap:6px;
}
.filter-chip::before{
  content:""; width:7px; height:7px; border-radius:50%; background: var(--hairline);
  transition: background .15s ease;
}
.filter-chip:hover{ border-color: var(--flag-blue-dim); color: var(--cream); }
.filter-chip.active{ background: var(--river-green); border-color: var(--river-green); color: var(--brick-deep); }
.filter-chip.active::before{ background: var(--brick-deep); }

.tools-divider{ width:1px; align-self:stretch; background: var(--hairline); margin: 0 2px; }

.seg-group{ display:flex; align-items:center; gap:8px; }
.seg-label{
  font-family:'IBM Plex Mono', monospace; font-size:9.5px; letter-spacing:1.4px; text-transform:uppercase;
  color: var(--cream-dim);
}
.segmented{
  display:flex; gap:2px;
  background: var(--brick-deep);
  border: 1px solid var(--hairline);
  border-radius: 999px;
  padding: 3px;
}
.segmented button{
  font-family:'Manrope', sans-serif; font-weight:600; font-size:11.5px;
  background: transparent; border:none; color: var(--cream-dim);
  padding: 6px 13px; border-radius: 999px; cursor:pointer; transition: all .15s ease;
}
.segmented button:hover{ color: var(--cream); }
.segmented button.active{
  background: var(--flag-blue); color: var(--brick-deep);
  box-shadow: 0 3px 10px rgba(79,168,222,0.4);
}
.segmented.view-seg button.active{ background: var(--flag-red); box-shadow: 0 3px 10px rgba(200,16,46,0.4); }
.dist-badge{ color: var(--flag-blue-bright); }

@media (max-width: 720px){
  .tools-divider{ display:none; }
  .seg-group{ flex-wrap:wrap; }
}

/* ---- Map view (self-contained, no external tiles — plots by relative
   coordinates so it always renders, even in sandboxed previews) ---- */
.map-wrap{ border-radius: 12px; overflow:hidden; border: 1px solid var(--hairline); background: var(--brick-panel); }
#leafletMapEl{ background: var(--brick-panel); }
.leaflet-popup-content-wrapper{ background: var(--brick-panel-hi); color: var(--cream); border-radius: 10px; }
.leaflet-popup-tip{ background: var(--brick-panel-hi); }
.leaflet-popup-content .map-popup-link{ color: var(--flag-blue-bright); }
.custom-map{
  position: relative; width: 100%; height: 520px;
  background:
    repeating-linear-gradient(0deg, transparent, transparent 39px, var(--hairline) 40px),
    repeating-linear-gradient(90deg, transparent, transparent 39px, var(--hairline) 40px),
    linear-gradient(160deg, var(--brick-panel-hi), var(--brick-panel));
}
.map-pin{
  position:absolute; width:15px; height:15px; border-radius:50%;
  transform: translate(-50%,-50%); cursor:pointer;
  border: 2px solid var(--brick-deep); padding:0;
  box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  transition: transform .12s ease;
}
.map-pin:hover{ transform: translate(-50%,-50%) scale(1.35); z-index: 6; }
.map-pin.visited{ background: var(--flag-red); }
.map-pin.unvisited{ background: var(--flag-blue); }
.map-legend{
  display:flex; align-items:center; gap:6px; font-size:11px; color: var(--cream-dim);
  margin-top:10px; flex-wrap:wrap;
}
.legend-dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }
.legend-dot.visited{ background: var(--flag-red); }
.legend-dot.unvisited{ background: var(--flag-blue); margin-left:14px; }
.map-note{ font-size:11.5px; color: var(--cream-dim); margin-top:8px; }
.map-popup{
  position:absolute; transform: translate(-50%,-115%);
  background: var(--brick-panel-hi); border: 1px solid var(--hairline); border-radius: 10px;
  padding: 10px 30px 10px 12px; min-width: 170px; max-width: 230px; z-index: 10;
  box-shadow: 0 14px 30px rgba(0,0,0,0.45);
}
.map-popup::after{
  content:""; position:absolute; left:50%; bottom:-6px; transform:translateX(-50%);
  border-width:6px 6px 0 6px; border-style:solid; border-color: var(--brick-panel-hi) transparent transparent transparent;
}
.map-popup .close-x{
  position:absolute; top:4px; right:6px; cursor:pointer; color: var(--cream-dim);
  background:none; border:none; font-size:14px; line-height:1;
}
.map-popup-name{ font-family:'Oswald', sans-serif; font-weight:700; font-size:14px; margin-bottom:2px; }
.map-popup-cat{ font-family:'IBM Plex Mono', monospace; font-size:9px; letter-spacing:1px; text-transform:uppercase; color: var(--flag-blue-bright); }
.map-popup-link{ display:inline-block; margin-top:6px; font-size:11px; color: var(--flag-blue-bright); text-decoration:none; margin-right:10px; }
.map-popup-link:hover{ text-decoration:underline; }

/* ---- Grid of cards ---- */
.grid{
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 16px;
  perspective: 900px;
}

.ticket{
  background: linear-gradient(160deg, var(--brick-panel-hi), var(--brick-panel) 60%);
  border: 1px solid var(--hairline);
  border-radius: 10px;
  padding: 16px 16px 14px;
  position: relative;
  cursor: pointer;
  overflow: hidden;
  transform-style: preserve-3d;
  transition: transform .12s ease, box-shadow .18s ease, border-color .18s ease;
  will-change: transform;
}
.ticket::before{
  content:"";
  position:absolute; inset:0;
  background: linear-gradient(115deg, transparent 40%, rgba(126,200,242,0.16) 50%, transparent 60%);
  background-size: 220% 220%;
  background-position: 130% 130%;
  transition: background-position .5s ease;
  pointer-events:none;
}
.ticket:hover{
  border-color: var(--flag-blue-dim);
  box-shadow: 0 22px 44px rgba(0,0,0,0.45), 0 4px 12px rgba(0,0,0,0.3);
}
.ticket:hover::before{ background-position: -30% -30%; }

.ticket-tags{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom:2px; }
.card-tag{
  display:inline-flex; align-items:center; gap:4px;
  font-family:'IBM Plex Mono', monospace;
  font-size:9px; letter-spacing:1.2px; text-transform:uppercase;
  color: var(--flag-blue-bright);
  border: 1px solid var(--flag-blue-dim);
  background: rgba(79,168,222,0.08);
  padding: 2.5px 8px;
  border-radius: 999px;
  line-height:1.4;
}
.ticket-name{
  font-family:'Oswald', sans-serif;
  font-weight:700; font-size:18px; margin:5px 0 6px; line-height:1.25;
  color: var(--cream);
}
.name-link{ color: inherit; text-decoration:none; border-bottom: 1px solid transparent; transition: color .15s ease, border-color .15s ease; }
.name-link:hover{ color: var(--flag-blue-bright); border-bottom-color: var(--flag-blue-bright); }
.ticket-addr{ font-size:11px; color: var(--cream-dim); margin-bottom:10px; }
.ticket-addr a.addr-link{ color: var(--cream-dim); text-decoration:none; border-bottom: 1px dotted var(--hairline); }
.ticket-addr a.addr-link:hover{ color: var(--flag-blue-bright); border-bottom-color: var(--flag-blue-bright); }
.ticket-meta{
  display:flex; justify-content:space-between; align-items:center;
  font-size:11.5px; color: var(--cream-dim);
  border-top: 1px solid var(--hairline); padding-top:9px;
}
.stars{ color: var(--rating-gold); letter-spacing:1px; }

.stamp{
  position:absolute; top:10px; right:8px;
  display:flex; align-items:center; gap:4px;
  transform: rotate(9deg) scale(1);
  color: var(--cream);
  font-family:'IBM Plex Mono', monospace;
  font-size: 8.5px; letter-spacing: 1.8px; font-weight:600;
  padding: 3px 9px 3px 6px;
  border-radius: 999px;
  border: 1.5px solid var(--cream);
  background: rgba(41,19,15,0.55);
  animation: stampPop .5s cubic-bezier(.2,1.4,.4,1);
  pointer-events:none;
}
.stamp svg path{ fill: var(--flag-red); }
.stamp svg{ width:11px; height:11px; flex-shrink:0; }
@keyframes stampPop{
  0%{ transform: rotate(9deg) scale(0); opacity:0; }
  60%{ transform: rotate(9deg) scale(1.15); opacity:1; }
  100%{ transform: rotate(9deg) scale(1); opacity:1; }
}

.empty{
  text-align:center; padding: 60px 20px; color: var(--cream-dim);
  border: 1px dashed var(--hairline); border-radius: 12px;
  font-size: 13px;
}
.empty b{ display:block; font-family:'Oswald', sans-serif; font-size:19px; color:var(--cream); margin-bottom:6px; }

/* ---- Modal ---- */
.overlay{
  position:fixed; inset:0; background: rgba(6,16,13,0.72);
  display:flex; align-items:flex-start; justify-content:center;
  padding: 40px 16px; overflow-y:auto; z-index: 50;
  animation: fadeIn .15s ease;
}
@keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
.modal{
  background: linear-gradient(170deg, var(--brick-panel-hi), var(--brick-panel));
  border: 1px solid var(--hairline);
  border-radius: 14px;
  max-width: 520px; width:100%;
  padding: 24px 24px 26px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.45), 0 0 0 1px rgba(79,168,222,0.08);
  animation: riseIn .18s cubic-bezier(.2,.9,.3,1.1);
}
@keyframes riseIn{ from{ opacity:0; transform: translateY(10px) scale(0.98); } to{ opacity:1; transform:none; } }
.modal h2{
  font-family:'Oswald', sans-serif; font-weight:700; font-size:22px; margin:0 0 2px; color: var(--cream);
}
.modal .close{
  float:right; cursor:pointer; font-size:20px; color: var(--cream-dim);
  background:none; border:none; font-family:inherit;
}
.modal .close:hover{ color: var(--flag-blue-bright); }
.field{ margin-top:15px; }
.field label{
  display:block; font-size:10.5px; letter-spacing:1px; text-transform:uppercase;
  color: var(--flag-blue); margin-bottom:6px; font-family:'IBM Plex Mono', monospace;
}
.field input, .field select, .field textarea{
  width:100%; font-family:'Manrope', sans-serif; font-size:13.5px;
  padding: 10px 12px; border:1px solid var(--hairline); border-radius:8px;
  background: var(--brick-deep); color: var(--cream);
}
.field input:focus, .field textarea:focus{
  outline:none; border-color: var(--flag-blue); box-shadow: 0 0 0 3px rgba(79,168,222,0.15);
}
.field textarea{ resize:vertical; min-height:50px; }
.row2{ display:flex; gap:10px; }
.row2 > div{ flex:1; }

/* ---- Mini calendar date picker ---- */
.date-display{
  width:100%; text-align:left; cursor:pointer;
  font-family:'Manrope', sans-serif; font-weight:600; font-size:13.5px;
  padding: 10px 12px; border:1px solid var(--hairline); border-radius:8px;
  background: var(--brick-deep); color: var(--cream);
  display:flex; align-items:center; gap:8px;
}
.date-display::before{ content:"📅"; font-size:13px; }
.date-display:hover{ border-color: var(--flag-blue-dim); }
.mini-cal{
  display:none; margin-top:8px;
  background: var(--brick-panel-hi); border:1px solid var(--hairline); border-radius:10px;
  padding: 10px 12px 12px;
  box-shadow: 0 14px 30px rgba(0,0,0,0.4);
}
.mini-cal.open{ display:block; }
.mini-cal-head{
  display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;
}
.mini-cal-head span{
  font-family:'Oswald', sans-serif; font-weight:600; font-size:13px; color: var(--cream);
}
.mini-cal-head button{
  background: var(--brick-deep); border:1px solid var(--hairline); color: var(--cream);
  width:24px; height:24px; border-radius:6px; cursor:pointer; font-size:13px; line-height:1;
}
.mini-cal-head button:hover{ border-color: var(--flag-blue-dim); }
.mini-cal-grid{
  display:grid; grid-template-columns: repeat(7, 1fr); gap:3px;
}
.cal-dow{
  font-family:'IBM Plex Mono', monospace; font-size:9.5px; color: var(--cream-dim);
  text-align:center; padding-bottom:4px; letter-spacing:0.5px;
}
.cal-cell{
  aspect-ratio: 1; display:flex; align-items:center; justify-content:center;
  background: transparent; border:1px solid transparent; border-radius:6px;
  color: var(--cream); font-family:'Manrope', sans-serif; font-size:12px;
  cursor:pointer; transition: all .12s ease;
}
.cal-cell.empty{ cursor:default; }
.cal-cell:not(.empty):hover{ background: var(--brick-deep); border-color: var(--flag-blue-dim); }
.cal-cell.today{ border-color: var(--flag-blue-dim); color: var(--flag-blue-bright); }
.cal-cell.selected{ background: var(--flag-blue); color: var(--brick-deep); font-weight:700; }

.star-pick{ display:flex; gap:6px; font-size:26px; }
.star-pick span{ cursor:pointer; color: var(--hairline); transition: transform .1s ease, color .1s ease; display:inline-block; }
.star-pick span.on{ color: var(--rating-gold); text-shadow: 0 0 10px rgba(217,164,65,0.5); }
.star-pick span:hover{ transform: scale(1.15); }

.toggle-pair{ display:flex; gap:8px; }
.toggle-pair button{
  flex:1; padding:9px; border:1px solid var(--hairline); background: var(--brick-deep); color: var(--cream-dim);
  border-radius:8px; cursor:pointer; font-family:'Manrope', sans-serif; font-weight:600; font-size:12.5px;
  transition: all .12s ease;
}
.toggle-pair button.yes.on{ background: var(--river-green); border-color: var(--river-green); color: var(--brick-deep); }
.toggle-pair button.no.on{ background: var(--flag-red); border-color: var(--flag-red); color: var(--cream); }

.modal-actions{ display:flex; gap:8px; margin-top:22px; justify-content:flex-end; }

/* ---- Detail / visit log ---- */
.detail-head{ display:flex; justify-content:space-between; align-items:flex-start; }
.detail-cat{ font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:1.8px; text-transform:uppercase; color:var(--flag-blue); }
.tag-row{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:6px; }
.tag-pill{
  display:inline-flex; align-items:center; gap:5px;
  font-family:'IBM Plex Mono', monospace; font-size:9.5px; letter-spacing:1.2px; text-transform:uppercase;
  color: var(--brick-deep); background: var(--flag-blue-bright);
  border-radius: 999px; padding: 4px 6px 4px 10px;
}
.tag-x{
  background:none; border:none; cursor:pointer; color: var(--brick-deep);

.tag-x:hover{ opacity:1; }
.tag-add{
  font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.8px;

}
.tag-add:focus{ outline:none; border-color: var(--flag-blue); color: var(--cream); }
.detail-name{ font-family:'Oswald', sans-serif; font-weight:700; font-size:24px; margin:4px 0; color: var(--cream); }
.detail-addr{ font-size:12px; color:var(--cream-dim); }
.detail-links{ display:flex; gap:8px; flex-wrap:wrap; margin-top:9px; }
.link-pill{
  font-family:'IBM Plex Mono', monospace; font-size:11px;

  border: 1px solid var(--hairline); border-radius: 999px;

.visit-list{ margin-top:18px; }

  border-top: 1px solid var(--hairline); padding: 11px 0;

}
.visit-item:first-child{ border-top:none; }
.visit-left b{ display:block; font-size:13.5px; font-family:'Manrope', sans-serif; }

/* ---- Confetti ---- */

  position:fixed; top:0; left:0; width:7px; height:7px; border-radius:1px;
  pointer-events:none; z-index: 200;
  animation: confettiFall .9s ease-out forwards;
}
@keyframes confettiFall{
  0%{ transform: translate(0,0) rotate(0deg); opacity:1; }
  100%{ transform: var(--fall); opacity:0; }
}

<body>

        <path transform="translate(38,20) scale(1.25)" d="M0,-4 L0.8,-1.39 L3.46,-2 L1.6,0 L3.46,2 L0.8,1.39 L0,4 L-0.8,1.39 L-3.46,2 L-1.6,0 L-3.46,-2 L-0.8,-1.39 Z"/>

<div id="modalRoot"></div>

<script>
let restaurants = [];
let visits = [];
let activeCategory = 'All';
let activeSubTag = null;
let dataLoaded = false;
let sortBy = 'name';
let userLocation = null;
let locationRequested = false;
let searchQuery = '';
let unvisitedOnly = false;
let viewMode = 'grid';
let leafletMap = null;
let mapRenderToken = 0;

const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function distanceMiles(lat1, lng1, lat2, lng2){
  const R = 3958.8;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLng = (lng2-lng1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function requestUserLocation(){
  if(locationRequested) return;
  locationRequested = true;
  if(!navigator.geolocation){ return; }
  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      renderContent();
    },
    ()=>{ /* denied or unavailable — falls back to unsorted-by-distance */ },
    { timeout: 8000 }
  );
}

function sortRestaurants(list){
  const arr = [...list];
  if(sortBy === 'name'){
    arr.sort((a,b)=> a.name.localeCompare(b.name));
  } else if(sortBy === 'date'){
    arr.sort((a,b)=> (b.createdAt||0) - (a.createdAt||0));
  } else if(sortBy === 'rating'){
    arr.sort((a,b)=>{
      const ra = avgRating(visitsFor(a.id));
      const rb = avgRating(visitsFor(b.id));
      if(ra==null && rb==null) return 0;
      if(ra==null) return 1;
      if(rb==null) return -1;
      return rb - ra;
    });
  } else if(sortBy === 'distance' && userLocation){
    arr.sort((a,b)=>{
      const da = (a.lat!=null && a.lng!=null) ? distanceMiles(userLocation.lat, userLocation.lng, a.lat, a.lng) : Infinity;
      const db = (b.lat!=null && b.lng!=null) ? distanceMiles(userLocation.lat, userLocation.lng, b.lat, b.lng) : Infinity;
      return da - db;
    });
  }
  return arr;
}

/* Storage abstraction: window.storage only exists inside Claude's own
   preview sandbox. Once this file is hosted standalone (GitHub Pages,
   installed as a PWA, opened as a local file), that API doesn't exist —
   so we fall back to localStorage, which every real browser supports. */
const store = {
  async get(key){
    if(window.storage){
      return await window.storage.get(key);
    }
    const raw = localStorage.getItem('rounds:' + key);
    return raw != null ? { key, value: raw } : null;
  },
  async set(key, value){
    if(window.storage){
      return await window.storage.set(key, value);
    }
    localStorage.setItem('rounds:' + key, value);
    return { key, value };
  }
};

async function loadData(){
  try{
    const r = await store.get('restaurants');
    restaurants = r && r.value ? JSON.parse(r.value) : [];
  }catch(e){ restaurants = []; }
  try{
    const v = await store.get('visits');
    visits = v && v.value ? JSON.parse(v.value) : [];
  }catch(e){ visits = []; }
  dataLoaded = true;
}

/* One-time migration: older entries had a single `category` string.
   Convert those to a `categories` array so a place can live in
   multiple guides. Safe to re-run — no-op once migrated. */
async function migrateCategories(){
  let changed = false;
  restaurants.forEach(r=>{
    if(!Array.isArray(r.categories)){
      r.categories = r.category ? [r.category] : [];
      delete r.category;
      changed = true;
    }
  });
  if(changed) await saveRestaurants();
}

async function saveRestaurants(){
  try{ await store.set('restaurants', JSON.stringify(restaurants)); }
  catch(e){ console.error('Could not save restaurants', e); }
}
async function saveVisits(){
  try{ await store.set('visits', JSON.stringify(visits)); }
  catch(e){ console.error('Could not save visits', e); }
}

function visitsFor(restaurantId){
  return visits.filter(v => v.restaurantId === restaurantId).sort((a,b)=> b.date.localeCompare(a.date));
}
function avgRating(list){
  if(!list.length) return null;
  return list.reduce((s,v)=>s+v.rating,0) / list.length;
}
function starString(n){
  const full = Math.round(n);
  return '★'.repeat(full) + '☆'.repeat(5-full);
}
function fmtDate(d){
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}

function categories(){
  const set = new Set();
  restaurants.forEach(r => (r.categories||[]).forEach(c => set.add(c)));
  return Array.from(set).sort();
}

/* Two-level tabs, two ways a tag can nest under a parent umbrella:
   1) Pattern match — anything containing "bar" (but not "Bars" itself)
      auto-nests under "Bars", no config needed, scales as you tag more.
   2) Explicit map — cuisine-style groupings that can't be guessed from
      the tag text (e.g. "Burgers" isn't detectably "American"). Extend
      this list any time you want another umbrella; just tell me the
      grouping and I'll add it here. */
const PARENT_GROUPS = {
  'American Cuisine': ['Burgers', 'Chicken', 'Steakhouses', 'BBQ', 'Hot Dogs', 'Pizza'],
  'Asian Cuisine': ['Japanese', 'Chinese', 'Korean', 'Ramen', 'Sushi', 'Asian Fusion'],
  'Sandwiches': ['Hoagie', 'Sandwich', 'Cheesesteak', 'Bagel', 'Wrap'],
  'Desserts': ['Ice Cream', 'Bakery', 'Frozen Yogurt'],
};
function groupForTag(tag){
  const lower = tag.toLowerCase();
  if(Object.values(PARENT_GROUPS).some(children => children.some(c=>c.toLowerCase()===lower))){
    for(const parent in PARENT_GROUPS){
      if(PARENT_GROUPS[parent].some(c=>c.toLowerCase()===lower)) return parent;
    }
  }
  if(Object.keys(PARENT_GROUPS).some(p=>p.toLowerCase()===lower)) return null;
  if(lower === 'bars') return null;
  if(/bar/i.test(tag)) return 'Bars';
  return null;
}
function topLevelLabels(){
  const cats = categories();
  const labels = new Set();
  cats.forEach(c=>{
    const g = groupForTag(c);
    labels.add(g || c);
  });
  return Array.from(labels).sort();
}
function isGroupLabel(label){
  return categories().some(c => groupForTag(c) === label);
}
function childTagsOf(group){
  return categories().filter(c => groupForTag(c) === group).sort();
}
function restaurantMatchesLabel(r, label, subTag){
  const tags = r.categories || [];
  if(isGroupLabel(label)){
    if(subTag) return tags.includes(subTag);
    return tags.some(t => groupForTag(t) === label || t === label);
  }
  return tags.includes(label);
}

function addTagToRestaurant(id, tag){
  const r = restaurants.find(x=>x.id===id);
  if(!r) return false;
  const clean = tag.trim();
  if(!clean) return false;
  if(!r.categories) r.categories = [];
  const exists = r.categories.some(c => c.toLowerCase() === clean.toLowerCase());
  if(exists) return false;
  r.categories.push(clean);
  return true;
}
function removeTagFromRestaurant(id, tag){
  const r = restaurants.find(x=>x.id===id);
  if(!r) return;
  r.categories = (r.categories||[]).filter(c => c !== tag);
}

/* ---------- Confetti (fun + interactive delight) ---------- */
function spawnConfetti(x, y){
  const colors = ['#4FA8DE', '#E23A50', '#F3EDE0', '#1FA463', '#7EC8F2'];
  for(let i=0; i<22; i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    const angle = Math.random() * Math.PI * 2;
    const dist = 60 + Math.random() * 90;
    const fx = Math.cos(angle) * dist;
    const fy = Math.sin(angle) * dist + 40;
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.setProperty('--fall', `translate(${fx}px, ${fy}px) rotate(${Math.random()*360}deg)`);
    p.style.animationDelay = (Math.random()*0.08) + 's';
    document.body.appendChild(p);
    setTimeout(()=> p.remove(), 1000);
  }
}

/* ---------- Card tilt (fun + interactive) ---------- */
function attachTilt(card){
  card.addEventListener('mousemove', (e)=>{
    const rect = card.getBoundingClientRect();
    const px = (e.clientX - rect.left) / rect.width - 0.5;
    const py = (e.clientY - rect.top) / rect.height - 0.5;
    card.style.transform = `perspective(900px) rotateY(${px*7}deg) rotateX(${-py*7}deg) translateY(-6px) scale(1.015)`;
  });
  card.addEventListener('mouseleave', ()=>{
    card.style.transform = '';
  });
}

function renderStats(){
  const total = restaurants.length;
  const visitedCount = restaurants.filter(r => visitsFor(r.id).length > 0).length;
  const totalVisits = visits.length;
  const allAvg = avgRating(visits);
  const el = $('#statsReceipt');
  el.innerHTML = `
    <div class="receipt-row"><span class="receipt-label">Listings on File</span><span class="receipt-val">${total}</span></div>
    <div class="receipt-row"><span class="receipt-label">Spots Visited</span><span class="receipt-val">${visitedCount}/${total}</span></div>
    <div class="receipt-row"><span class="receipt-label">Visits Logged</span><span class="receipt-val">${totalVisits}</span></div>
    <div class="receipt-row"><span class="receipt-label">Average Rating</span><span class="receipt-val${allAvg ? '' : ' muted'}">${allAvg ? allAvg.toFixed(1) + ' ★' : '—'}</span></div>
  `;
}

function renderTabs(){
  const labels = topLevelLabels();
  const tabsEl = $('#tabs');
  const allCount = restaurants.length;
  let html = `<button class="tab ${activeCategory==='All'?'active':''}" data-cat="All">All <span class="cnt">${allCount}</span></button>`;
  labels.forEach(label=>{
    const count = restaurants.filter(r => restaurantMatchesLabel(r, label, null)).length;
    const isGroup = isGroupLabel(label);
    html += `<button class="tab ${activeCategory===label?'active':''}" data-cat="${escapeHtml(label)}">${escapeHtml(label)}${isGroup ? ' ▾' : ''} <span class="cnt">${count}</span></button>`;
  });
  tabsEl.innerHTML = html;
  $$('.tab', tabsEl).forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeCategory = btn.dataset.cat;
      activeSubTag = null;
      renderTabs();
      renderContent();
    });
  });

  const subEl = $('#subTabs');
  if(isGroupLabel(activeCategory)){
    const children = childTagsOf(activeCategory);
    subEl.style.display = 'flex';
    subEl.innerHTML = `<button class="sub-tab ${!activeSubTag?'active':''}" data-sub="">All ${escapeHtml(activeCategory)}</button>` +
      children.map(c=>{
        const count = restaurants.filter(r=>(r.categories||[]).includes(c)).length;
        return `<button class="sub-tab ${activeSubTag===c?'active':''}" data-sub="${escapeHtml(c)}">${escapeHtml(c)} <span class="cnt">${count}</span></button>`;
      }).join('');
    $$('.sub-tab', subEl).forEach(btn=>{
      btn.addEventListener('click', ()=>{
        activeSubTag = btn.dataset.sub || null;
        renderTabs();
        renderContent();
      });
    });
  } else {
    subEl.style.display = 'none';
    subEl.innerHTML = '';
  }
}

/* Display-only singular form for venue-type tags on cards — a single
   restaurant is "a Steakhouse", not "Steakhouses". Cuisine/food tags
   (Ramen, Sushi, Chicken, BBQ, etc.) read fine as-is, so only the
   venue-type plurals need a mapped singular. Underlying tag data and
   tab filtering/counts are untouched — this only affects card text. */
const TAG_SINGULAR = {
  'bars': 'Bar',
  'sports bars': 'Sports Bar',
  'tiki bars': 'Tiki Bar',
  'cocktail bars': 'Cocktail Bar',
  'steakhouses': 'Steakhouse',
  'burgers': 'Burger',
  'desserts': 'Dessert',
  'hot dogs': 'Hot Dog',
};
function singularizeTag(tag){
  return TAG_SINGULAR[tag.toLowerCase()] || tag;
}

/* A small icon per tag adds personality to the card chips without
   needing custom art for every possible guide category. Falls back
   to a plain fork & knife for anything not explicitly mapped. */
const TAG_ICON = {
  'bars': '🍸', 'sports bars': '🏈', 'tiki bars': '🌺', 'cocktail bars': '🍹',
  'steakhouses': '🥩', 'burgers': '🍔', 'chicken': '🍗', 'bbq': '🍖',
  'ramen': '🍜', 'sushi': '🍣', 'chinese': '🥡', 'japanese': '🍱',
  'korean': '🍲', 'asian fusion': '🥢', 'desserts': '🍰',
  'indian cuisine': '🍛', 'dinner dates': '💕',
  'hoagie': '🥪', 'sandwich': '🥪', 'cheesesteak': '🧀', 'bagel': '🥯', 'wrap': '🌯',
  'hot dogs': '🌭', 'pizza': '🍕', 'halal': '🕌', 'catering': '🍽️',
  'mexican': '🌮', 'peruvian': '🍤', 'fondue': '🫕', 'seafood': '🦐', 'tapas': '🍢',
  'breakfast & brunch': '🥞', 'rooftop': '🏙️',
  'ice cream': '🍦', 'bakery': '🥐', 'frozen yogurt': '🍧',
  'happy hour': '🍻', 'late night': '🌙', 'jamaican': '🇯🇲', 'soul food': '🍲', 'italian': '🍝',
};
function tagIcon(tag){
  return TAG_ICON[tag.toLowerCase()] || '🍴';
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function getFilteredSortedList(){
  let list = restaurants.filter(r => activeCategory==='All' || restaurantMatchesLabel(r, activeCategory, activeSubTag));
  if(searchQuery.trim()){
    const q = searchQuery.trim().toLowerCase();
    list = list.filter(r => r.name.toLowerCase().includes(q));
  }
  if(unvisitedOnly){
    list = list.filter(r => visitsFor(r.id).length === 0);
  }
  return sortRestaurants(list);
}

function renderContent(){
  const el = $('#content');
  const list = getFilteredSortedList();
  if(list.length === 0){
    el.className = '';
    el.innerHTML = restaurants.length === 0
      ? `<div class="empty"><b>No listings in this book yet</b>Add your first stop to start tracking it.</div>`
      : `<div class="empty"><b>No listings match</b>Try a different search, filter, or tab.</div>`;
    if(leafletMap){ try{ leafletMap.remove(); }catch(e){} leafletMap = null; }
    return;
  }
  if(viewMode === 'map'){
    renderMapView(el, list);
    return;
  }
  if(leafletMap){ try{ leafletMap.remove(); }catch(e){} leafletMap = null; }
  el.className = 'grid';
  el.innerHTML = list.map(r=>{
    const vs = visitsFor(r.id);
    const avg = avgRating(vs);
    const visited = vs.length > 0;
    const tags = r.categories || [];
    const showDist = sortBy === 'distance' && userLocation && r.lat!=null && r.lng!=null;
    const distTxt = showDist ? distanceMiles(userLocation.lat, userLocation.lng, r.lat, r.lng).toFixed(1) + ' mi' : null;
    return `
      <div class="ticket" data-id="${r.id}">
        ${visited ? `<div class="stamp"><svg viewBox="-4 -4 8 8" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M0,-4 L0.8,-1.39 L3.46,-2 L1.6,0 L3.46,2 L0.8,1.39 L0,4 L-0.8,1.39 L-3.46,2 L-1.6,0 L-3.46,-2 L-0.8,-1.39 Z"/></svg>VISITED</div>` : ''}
        <div class="ticket-tags">${tags.map(t=>`<span class="card-tag">${tagIcon(t)} ${escapeHtml(singularizeTag(t))}</span>`).join('')}</div>

/* Map view: tries a real interactive street map first (Leaflet + OpenStreetMap
   tiles). Some sandboxed preview environments block cross-origin tile images,
   so if tiles haven't loaded within ~2.5s, it automatically swaps to a
   self-contained relative-position map that needs no network access at all.
   Opening the downloaded file in a normal browser will always show the real map. */
function renderMapView(el, list){
  const myToken = ++mapRenderToken;
  const withCoords = list.filter(r => r.lat != null && r.lng != null);
  const withoutCoords = list.length - withCoords.length;
  el.className = '';

  if(withCoords.length === 0){
    el.innerHTML = `<div class="empty"><b>No locations to plot</b>None of the places in this view have coordinates on file yet.</div>`;
    return;
  }

  const noteHtml = withoutCoords > 0
    ? `<div class="map-note">${withoutCoords} listing${withoutCoords===1?'':'s'} in this view ${withoutCoords===1?"doesn't":"don't"} have a location yet, so ${withoutCoords===1?"it isn't":"they aren't"} plotted.</div>`
    : '';

  if(leafletMap){ try{ leafletMap.remove(); }catch(e){} leafletMap = null; }

  if(typeof L === 'undefined'){
    renderRelativeMap(el, withCoords, noteHtml);
    return;
  }

  el.innerHTML = `<div class="map-wrap"><div id="leafletMapEl" style="height:520px;"></div></div>${noteHtml}`;

  const bounds = withCoords.map(r=>[r.lat, r.lng]);
  const center = bounds[0];
  leafletMap = L.map('leafletMapEl', { scrollWheelZoom: true }).setView(center, 11);
  const tileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors', maxZoom: 19
  });
  let tilesOk = false;
  tileLayer.on('load', ()=>{ tilesOk = true; });
  tileLayer.addTo(leafletMap);

  withCoords.forEach(r=>{
    const vs = visitsFor(r.id);
    const visited = vs.length > 0;
    const color = visited ? '#E23A50' : '#4FA8DE';
    const marker = L.circleMarker([r.lat, r.lng], {
      radius: 8, color: '#12302799', weight: 2, fillColor: color, fillOpacity: 0.95
    }).addTo(leafletMap);
    const avg = avgRating(vs);
    const mapsHref = r.mapsUrl || ('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(r.name + ' ' + (r.address||'')));
    marker.bindPopup(`
      <div class="map-popup-cat">${(r.categories||[]).map(t=>tagIcon(t)+' '+escapeHtml(singularizeTag(t))).join(' · ')}</div>
      <div class="map-popup-name">${escapeHtml(r.name)}</div>
      <div style="font-size:11px;">${vs.length} visit${vs.length===1?'':'s'}${avg ? ' · ' + starString(avg) : ''}</div>
      <a class="map-popup-link" href="${mapsHref}" target="_blank" rel="noopener">📍 Maps</a>
      <a class="map-popup-link" href="javascript:void(0)" onclick="openDetail('${r.id}')">View details</a>
    `);
    marker.on('mouseover', ()=> marker.openPopup());
  });
  if(bounds.length > 1){
    leafletMap.fitBounds(bounds, { padding: [30,30] });
  }

  setTimeout(()=>{
    if(myToken !== mapRenderToken) return; // a newer render happened, ignore
    if(!tilesOk){
      if(leafletMap){ try{ leafletMap.remove(); }catch(e){} leafletMap = null; }
      renderRelativeMap(el, withCoords, noteHtml, true);
    }
  }, 2500);
}

/* Self-contained fallback: plots pins by relative position within the
   list's coordinate bounds. No external network access needed. */
function renderRelativeMap(el, withCoords, noteHtml, wasFallback){
  let minLat = Math.min(...withCoords.map(r=>r.lat));
  let maxLat = Math.max(...withCoords.map(r=>r.lat));
  let minLng = Math.min(...withCoords.map(r=>r.lng));
  let maxLng = Math.max(...withCoords.map(r=>r.lng));
  const latPad = Math.max((maxLat - minLat) * 0.15, 0.01);
  const lngPad = Math.max((maxLng - minLng) * 0.15, 0.01);
  minLat -= latPad; maxLat += latPad; minLng -= lngPad; maxLng += lngPad;

  const pins = withCoords.map(r=>{
    const xPct = ((r.lng - minLng) / (maxLng - minLng)) * 100;
    const yPct = (1 - (r.lat - minLat) / (maxLat - minLat)) * 100;
    const visited = visitsFor(r.id).length > 0;
    return `<button class="map-pin ${visited?'visited':'unvisited'}" style="left:${xPct}%; top:${yPct}%;" data-id="${r.id}" data-x="${xPct}" data-y="${yPct}" title="${escapeHtml(r.name)}"></button>`;
  }).join('');

  el.innerHTML = `
    <div class="map-wrap"><div class="custom-map" id="customMap">${pins}</div></div>
    <div class="map-legend"><span class="legend-dot visited"></span> Visited <span class="legend-dot unvisited"></span> Not yet</div>
    ${wasFallback ? `<div class="map-note">Live map tiles aren't reachable in this preview, so this shows relative positions instead. Download the file and open it in your browser for the full street map.</div>` : ''}
    ${noteHtml}
  `;

  const mapEl = $('#customMap');
  $$('.map-pin', mapEl).forEach(pin=>{
    pin.addEventListener('mouseenter', ()=> showMapPopup(mapEl, pin));
    pin.addEventListener('click', (e)=>{
      e.stopPropagation();
      showMapPopup(mapEl, pin);
    });
  });
  mapEl.addEventListener('click', ()=>{
    const existing = mapEl.querySelector('.map-popup');
    if(existing) existing.remove();
  });
}

function showMapPopup(mapEl, pinEl){
  const existing = mapEl.querySelector('.map-popup');
  if(existing) existing.remove();
  const id = pinEl.dataset.id;
  const r = restaurants.find(x=>x.id===id);
  if(!r) return;
  const vs = visitsFor(id);
  const avg = avgRating(vs);
  const mapsHref = r.mapsUrl || ('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(r.name + ' ' + (r.address||'')));
  const popup = document.createElement('div');
  popup.className = 'map-popup';
  popup.style.left = pinEl.dataset.x + '%';
  popup.style.top = pinEl.dataset.y + '%';
  popup.innerHTML = `
    <button class="close-x">×</button>
    <div class="map-popup-cat">${(r.categories||[]).map(t=>tagIcon(t)+' '+escapeHtml(singularizeTag(t))).join(' · ')}</div>
    <div class="map-popup-name">${escapeHtml(r.name)}</div>
    <div style="font-size:11px;color:var(--cream-dim);">${vs.length} visit${vs.length===1?'':'s'}${avg ? ' · ' + starString(avg) : ''}</div>
    <a class="map-popup-link" href="${mapsHref}" target="_blank" rel="noopener">📍 Maps</a>
    <a class="map-popup-link" href="javascript:void(0)" data-detail="${id}">View details</a>
  `;
  mapEl.appendChild(popup);
  popup.addEventListener('click', (e)=> e.stopPropagation());
  popup.querySelector('.close-x').addEventListener('click', ()=> popup.remove());
  popup.querySelector('[data-detail]').addEventListener('click', ()=>{ popup.remove(); openDetail(id); });
}

function openLogVisit(restaurantId){
  let rating = 0;
  let wouldReturn = null;
  const today = new Date().toISOString().slice(0,10);
  let selectedDate = today;
  let calViewYear = parseInt(today.slice(0,4));
  let calViewMonth = parseInt(today.slice(5,7)) - 1;

  const pastDishes = Array.from(new Set(
    visits.filter(v => v.restaurantId === restaurantId && v.ate).map(v => v.ate)
  ));
  const dishOptions = pastDishes.map(d=>`<option value="${escapeHtml(d)}">`).join('');

  $('#modalRoot').innerHTML = `
    <div class="overlay" id="ov2">
      <div class="modal">
        <button class="close" id="closeLog">×</button>
        <h2>Log a Visit</h2>
        <div class="field">
          <label>Date</label>
          <button type="button" class="date-display" id="dateDisplay">${fmtDate(selectedDate)}</button>
          <div class="mini-cal" id="miniCal">
            <div class="mini-cal-head">
              <button type="button" id="calPrev">‹</button>
              <span id="calMonthLabel"></span>
              <button type="button" id="calNext">›</button>
            </div>
            <div class="mini-cal-grid" id="calGrid"></div>
          </div>
        </div>
        <div class="field">
          <label>What did you eat? ${pastDishes.length ? '<span style="text-transform:none;">(pick from your past orders, or type new)</span>' : ''}</label>
          <input type="text" id="vAte" list="dishList" placeholder="e.g. Buffalo wings + fries">
          <datalist id="dishList">${dishOptions}</datalist>
        </div>
        <div class="field">
          <label>Rating</label>
          <div class="star-pick" id="starPick">
            ${[1,2,3,4,5].map(n=>`<span data-n="${n}">★</span>`).join('')}
          </div>
        </div>
        <div class="field">
          <label>Would you go back?</label>
          <div class="toggle-pair">
            <button class="yes" id="wrYes">Yes</button>
            <button class="no" id="wrNo">No</button>
          </div>
        </div>
        <div class="field">
          <label>Notes <span style="text-transform:none;">(optional)</span></label>
          <textarea id="vNotes" placeholder="e.g. Great patio, ask for Jesse, loud on weekends"></textarea>
        </div>
        <div class="modal-actions">
          <button class="btn secondary" id="cancelLog">Cancel</button>
          <button class="btn" id="saveLog">Save Visit</button>
        </div>
      </div>
    </div>
  `;

  function renderCalendar(){
    const grid = $('#calGrid');
    const label = $('#calMonthLabel');
    const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    label.textContent = monthNames[calViewMonth] + ' ' + calViewYear;
    const firstDay = new Date(calViewYear, calViewMonth, 1).getDay();
    const daysInMonth = new Date(calViewYear, calViewMonth+1, 0).getDate();
    let html = ['S','M','T','W','T','F','S'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
    for(let i=0;i<firstDay;i++) html += `<div class="cal-cell empty"></div>`;
    for(let day=1; day<=daysInMonth; day++){
      const dStr = `${calViewYear}-${String(calViewMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const isSel = dStr === selectedDate;
      const isToday = dStr === today;
      html += `<button type="button" class="cal-cell${isSel?' selected':''}${isToday?' today':''}" data-date="${dStr}">${day}</button>`;
    }
    grid.innerHTML = html;
    $$('.cal-cell:not(.empty)', grid).forEach(cell=>{
      cell.addEventListener('click', ()=>{
        selectedDate = cell.dataset.date;
        $('#dateDisplay').textContent = fmtDate(selectedDate);
        $('#miniCal').classList.remove('open');
        renderCalendar();
      });
    });
  }
  renderCalendar();

  $('#dateDisplay').addEventListener('click', (e)=>{
    e.stopPropagation();
    $('#miniCal').classList.toggle('open');
  });
  $('#calPrev').addEventListener('click', ()=>{
    calViewMonth--; if(calViewMonth<0){ calViewMonth=11; calViewYear--; }
    renderCalendar();
  });
  $('#calNext').addEventListener('click', ()=>{
    calViewMonth++; if(calViewMonth>11){ calViewMonth=0; calViewYear++; }
    renderCalendar();
  });
  $('.modal', $('#modalRoot')).addEventListener('click', (e)=>{
    if(!e.target.closest('#miniCal') && !e.target.closest('#dateDisplay')){
      $('#miniCal').classList.remove('open');
    }
  });

  const starEls = $$('#starPick span');
  starEls.forEach(s=>{
    s.addEventListener('mouseenter', ()=>{
      const n = parseInt(s.dataset.n);
      starEls.forEach(x=> x.classList.toggle('on', parseInt(x.dataset.n) <= n));
    });
    s.addEventListener('click', ()=>{
      rating = parseInt(s.dataset.n);
    });
  });
  $('#starPick').addEventListener('mouseleave', ()=>{
    starEls.forEach(x=> x.classList.toggle('on', parseInt(x.dataset.n) <= rating));
  });
  $('#wrYes').addEventListener('click', ()=>{
    wouldReturn = true;
    $('#wrYes').classList.add('on'); $('#wrNo').classList.remove('on');
  });
  $('#wrNo').addEventListener('click', ()=>{
    wouldReturn = false;
    $('#wrNo').classList.add('on'); $('#wrYes').classList.remove('on');
  });
  $('#closeLog').addEventListener('click', ()=> openDetail(restaurantId));
  $('#cancelLog').addEventListener('click', ()=> openDetail(restaurantId));
  $('#ov2').addEventListener('click', (e)=>{ if(e.target.id==='ov2') openDetail(restaurantId); });
  $('#saveLog').addEventListener('click', async (e)=>{
    if(!rating){ alert('Pick a rating.'); return; }
    if(wouldReturn === null){ alert('Let us know if you\'d go back.'); return; }
    const date = selectedDate || today;
    const ate = $('#vAte').value.trim();
    const notes = $('#vNotes').value.trim();
    visits.push({ id: uid(), restaurantId, date, ate, rating, wouldReturn, notes, createdAt: Date.now() });
    await saveVisits();
    const rect = e.target.getBoundingClientRect();
    spawnConfetti(rect.left + rect.width/2, rect.top + rect.height/2);
    openDetail(restaurantId);
    renderAll();
  });
}

async function seedIfNeeded(){
  let added = false;
  SEED_RESTAURANTS.forEach(s=>{
    const existing = restaurants.find(r => r.name.toLowerCase() === s.name.toLowerCase());
    if(existing){
      if(addTagToRestaurant(existing.id, s.category)) added = true;
      if(!existing.address && s.address){ existing.address = s.address; added = true; }
    } else {
      restaurants.push({ id: uid(), name: s.name, categories: [s.category], address: s.address || '', createdAt: Date.now() });
      added = true;
    }
  });
  if(added) await saveRestaurants();
}

async function enrichAddresses(){
  let changed = false;
  ADDRESS_LOOKUP.forEach(entry=>{
    const r = restaurants.find(x => x.name.toLowerCase() === entry.name.toLowerCase());
    if(r){
      const mapsUrl = `https://www.google.com/maps/place/?q=place_id:${entry.placeId}`;
      const closedFlag = !!entry.permanentlyClosed;
      const website = entry.website || null;
      if(r.address !== entry.address || r.phone !== entry.phone || r.mapsUrl !== mapsUrl || r.lat !== entry.lat || r.lng !== entry.lng || r.permanentlyClosed !== closedFlag || (website && r.website !== website)){
        r.address = entry.address;
        r.phone = entry.phone;
        r.mapsUrl = mapsUrl;
        r.lat = entry.lat;
        r.lng = entry.lng;
        r.permanentlyClosed = closedFlag;
        if(website) r.website = website;
        changed = true;
      }
    }
  });
  if(changed) await saveRestaurants();
}

/* Places flagged permanentlyClosed (from Apple Maps guide data or manual
   tagging) are removed automatically, along with any visits logged there.
   Safe to re-run — no-op once a place is already gone. */
async function removeClosedPlaces(){
  const closed = restaurants.filter(r => r.permanentlyClosed);
  if(closed.length === 0) return;
  const closedIds = new Set(closed.map(r => r.id));
  restaurants = restaurants.filter(r => !closedIds.has(r.id));
  visits = visits.filter(v => !closedIds.has(v.restaurantId));
  await saveRestaurants();
  await saveVisits();
}

/* Desserts places used to carry one flat "Desserts" tag; now that they
   have specific subtypes (Ice Cream / Bakery / Frozen Yogurt), drop the
   old generic tag so it doesn't sit alongside the new one. Safe to
   re-run — no-op once already migrated. */
const DESSERT_RETAG_NAMES = [
  "Nitro Nostalgia", "Classic Cobbler Cafe", "Pan Artesanal", "Panaderia La Central",
  "La Central Bakery", "Forever Yogurt", "Shawn Michelle's Homemade Ice Cream",
  "Legend Tasty House", "Molly's Cupcakes",
];
async function retagDesserts(){
  let changed = false;
  DESSERT_RETAG_NAMES.forEach(name=>{
    const r = restaurants.find(x => x.name.toLowerCase() === name.toLowerCase());
    if(r && r.categories && r.categories.includes('Desserts')){
      r.categories = r.categories.filter(c => c !== 'Desserts');
      changed = true;
    }
  });
  if(changed) await saveRestaurants();
}

(async function init(){
  await loadData();
  await migrateCategories();
  await seedIfNeeded();
  await enrichAddresses();
  await removeClosedPlaces();
  await retagDesserts();
  renderAll();
})();
